  image: ""
  summary: >
    Postdoctoral researcher in the biomass team (BIOGEO group) at LSCE, Paris-Saclay,
    and in the TreeSense group at the University of Copenhagen, assessing forest carbon
    stocks by combining satellite data (Sentinel-1/2, GEDI, LiDAR, SPOT 6/7) with deep
    learning to map forest height, wood volume, biomass and their changes.

